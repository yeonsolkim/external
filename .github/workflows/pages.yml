name: Build and deploy Jekyll site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write   # the narration step commits generated lecture scripts back to _narration/
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore rendered TikZ diagrams
        uses: actions/cache@v4
        with:
          path: .jekyll-cache/tikzcd
          key: tikzcd-v4-${{ runner.os }}-${{ hashFiles('_plugins/tikzcd_renderer.rb', '_posts/**/*.md', '*.md') }}
          restore-keys: |
            tikzcd-v4-${{ runner.os }}-

      - name: Try Jekyll build with cached TikZ diagrams
        id: cached-build
        run: |
          if bundle exec jekyll build; then
            echo "cache-complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache-complete=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          JEKYLL_ENV: production

      - name: Install TikZ renderer
        if: steps.cached-build.outputs.cache-complete != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            dvisvgm \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-pictures

      - name: Build with Jekyll
        if: steps.cached-build.outputs.cache-complete != 'true'
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      # ---- Audio narration (_narrator/): scripts -> mp3 -> bucket, manifests + podcast.xml into _site.
      # Runs only once the bucket secrets exist, so the site keeps deploying before they are set.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Narration — tests
        run: python3 -m unittest discover -s _narrator/tests -t .

      - name: Narration — ffmpeg
        env:
          HAS_STORE: ${{ secrets.S3_BUCKET }}
        if: env.HAS_STORE != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Narration — publish
        env:
          HAS_STORE: ${{ secrets.S3_BUCKET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: auto
        if: env.HAS_STORE != ''
        # New speech per post is capped; raise it deliberately for a big backfill.
        run: python3 -m _narrator publish _site --max-new-minutes 60

      - name: Narration — commit generated scripts
        env:
          HAS_STORE: ${{ secrets.S3_BUCKET }}
        if: env.HAS_STORE != ''
        run: |
          if [ -n "$(git status --porcelain _narration audio podcast.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _narration audio podcast.xml
            git commit -m "narration: generated scripts and audio index [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
