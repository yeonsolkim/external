baseurl: ""
description: "A backup external memory containing several data files"
url: "https://yeonsolkim.com"
# Pages builds in UTC; pin it so local builds produce the same post URLs (/2026/07/30/…).
timezone: UTC
fixed_banner_title: "External"
comments_enabled: false
author: YeonsolKim  
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
social:
  name: YeonsolKim
  links:
    - https://github.com/yeonsolkim
markdown: kramdown
kramdown:
  math_engine: mathjax

# Audio narration (_narrator/): podcast + in-page player. AUDIO_BASE_URL in the env overrides audio_url.
narration:
  author: Yeonsol Kim
  audio_url: https://audio.yeonsolkim.com
  voice: cedar
  podcast: true          # false → no podcast.xml and no feed link; the in-page player is unaffected
