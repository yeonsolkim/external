baseurl: ""
# The site name, given as og:site_name and as the home page's name in its structured data
# (see `social` below). The home page is titled by it too (index.md), since Google reads the
# site name from all three; no other page's <title> carries it (_plugins/search_metadata.rb).
title: External
# What search results show for the home page; also the podcast's channel description.
description: "Notes on undergraduate mathematics by Yeonsol Kim, written out in full: definitions, theorems, and proofs in set theory, logic, algebra, analysis, and probability."
url: "https://yeonsolkim.com"
# Pages builds in UTC; pin it so local builds give posts the same dates (and the redirects in
# _data/redirects.yml the dates of the old URLs they stand for).
timezone: UTC
fixed_banner_title: "External"
comments_enabled: false
author: Yeonsol Kim  
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
# No `name` here: jekyll-seo-tag would give it to the home page's structured data in place of
# `title`, and Google reads the site name from there.
social:
  links:
    - https://github.com/yeonsolkim
markdown: kramdown
kramdown:
  math_engine: mathjax

# Files for the repository, not the site. Built, LICENSE would land on _site/LICENSE, which a
# case-insensitive disk (macOS's default) treats as the License page's _site/license/; the
# others would be served as they are: README.md (no front matter), scripts/ (the local
# workflows' tools) and templates/ (Obsidian's note templates).
exclude:
  - LICENSE
  - README.md
  - scripts/
  - templates/

# Audio narration (_narrator/): podcast + in-page player. AUDIO_BASE_URL in the env overrides audio_url.
narration:
  author: Yeonsol Kim
  audio_url: https://audio.yeonsolkim.com
  voice: cedar
  podcast: true          # false → no podcast.xml and no feed link; the in-page player is unaffected
